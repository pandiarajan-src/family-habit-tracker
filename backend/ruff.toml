target-version = "py314"
line-length = 100

[lint]
# DTZ: no naive datetimes / datetime.now() (time comes from app/clock.py).
select = ["E", "W", "F", "I", "B", "UP", "S", "DTZ", "SIM", "RUF"]

[lint.per-file-ignores]
# assert is how pytest checks things; tests use fixed sample passcodes and PINs.
"tests/**" = ["S101", "S105", "S106"]

[format]
quote-style = "double"
